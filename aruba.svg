<?xml version="1.0" encoding="UTF-8"?>
<!-- Brand-evocative Aruba mark for the mode tab bar: Aruba orange wireless
     arcs on a dark chip so the icon keeps its contrast on both the muted
     unselected tab and the solid orange selected tab. Drawn by hand, no
     external assets, compiled into the exe through ACS_Wynn_Builder.qrc. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="arubaOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC46B"/>
      <stop offset="0.45" stop-color="#FF8300"/>
      <stop offset="1" stop-color="#E36A00"/>
    </linearGradient>
    <linearGradient id="arubaChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="1" stop-color="#04090F"/>
    </linearGradient>
  </defs>
  <rect x="0.7" y="0.7" width="22.6" height="22.6" rx="6.6"
        fill="url(#arubaChip)" stroke="#FF8300" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M4.6 14.4 A 10.4 10.4 0 0 1 19.4 14.4"
        fill="none" stroke="url(#arubaOrange)" stroke-width="2.15" stroke-linecap="round"/>
  <path d="M8.1 17.3 A 5.6 5.6 0 0 1 15.9 17.3"
        fill="none" stroke="url(#arubaOrange)" stroke-width="2.15" stroke-linecap="round"/>
  <circle cx="12" cy="19.4" r="1.85" fill="url(#arubaOrange)"/>
</svg>
