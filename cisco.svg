<?xml version="1.0" encoding="UTF-8"?>
<!-- Brand-evocative Cisco mark for the mode tab bar: the nine-bar bridge /
     signal motif in Cisco blue on a dark chip so the icon keeps its contrast
     on both the muted unselected tab and the solid blue selected tab. Drawn by
     hand, no external assets, compiled into the exe through
     ACS_Wynn_Builder.qrc. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="ciscoBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FDCFF"/>
      <stop offset="0.5" stop-color="#049FD9"/>
      <stop offset="1" stop-color="#0176A6"/>
    </linearGradient>
    <linearGradient id="ciscoChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="1" stop-color="#04090F"/>
    </linearGradient>
  </defs>
  <rect x="0.7" y="0.7" width="22.6" height="22.6" rx="6.6"
        fill="url(#ciscoChip)" stroke="#049FD9" stroke-opacity="0.5" stroke-width="1"/>
  <g fill="url(#ciscoBlue)">
    <rect x="3.4"  y="13.7" width="1.4" height="4.7"  rx="0.7"/>
    <rect x="5.4"  y="10.1" width="1.4" height="8.3"  rx="0.7"/>
    <rect x="7.4"  y="5.0"  width="1.4" height="13.4" rx="0.7"/>
    <rect x="9.4"  y="5.0"  width="1.4" height="13.4" rx="0.7"/>
    <rect x="11.4" y="5.0"  width="1.4" height="13.4" rx="0.7"/>
    <rect x="13.4" y="5.0"  width="1.4" height="13.4" rx="0.7"/>
    <rect x="15.4" y="5.0"  width="1.4" height="13.4" rx="0.7"/>
    <rect x="17.4" y="10.1" width="1.4" height="8.3"  rx="0.7"/>
    <rect x="19.4" y="13.7" width="1.4" height="4.7"  rx="0.7"/>
  </g>
</svg>
